  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var origFetch = window.fetch;
          if (origFetch) {
            Object.defineProperty(window, 'fetch', {
              value: origFetch.bind(window),
              writable: true,
              configurable: true,
            });
          }
        } catch (e) {}
        window.addEventListener(
          'error',
          function (e) {
            if (e && e.filename && e.filename.indexOf('chrome-extension://') === 0) {
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          },
          true
        );
      })();
    </script>
