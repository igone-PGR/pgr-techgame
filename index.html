<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var origFetch = window.fetch;
          if (origFetch) {
            Object.defineProperty(window, 'fetch', {
              value: origFetch.bind(window),
              writable: true,
              configurable: true,
            });
          }
        } catch (e) {}
        window.addEventListener(
          'error',
          function (e) {
            if (e && e.filename && e.filename.indexOf('chrome-extension://') === 0) {
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          },
          true
        );
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>THE HACKER: DIGITAL WORLD</title>
    <meta name="description" content="Videojuego móvil 2D tipo arcade/plataformas moderno. Recorre 7 mundos tecnológicos y salva el Digital Core." />

      * {

      .electric-glow {
        box-shadow: 0 0 24px rgba(0, 229, 255, 0.35), inset 0 0 12px rgba(0, 229, 255, 0.15);
      }
      .matrix-glow {
        box-shadow: 0 0 24px rgba(0, 255, 102, 0.35), inset 0 0 12px rgba(0, 255, 102, 0.15);

  <body class="bg-[#050811] text-white select-none overflow-hidden">

    <script>
      // Fallback inmediato para GitHub Pages (cuando se sirve directamente desde la rama sin compilador Vite)
      window.addEventListener('DOMContentLoaded', function () {
        setTimeout(function () {
          if (!window.__HACKER_APP_MOUNTED__) {
            var script = document.createElement('script');
            script.src = './standalone-app.js';
            document.body.appendChild(script);
          }
        }, 120);
      });
